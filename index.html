<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="header">
        <h1>Tic-Tac-Toe</h1>
    </header>
    <main>
        <h2 id="playerTurn" class="playerTurnElement"></h2>
        <div id="grid" class="grid-container">
            <button id="00" class="cell">X</button>
            <button id="01" class="cell">X</button>
            <button id="02" class="cell">O</button>
            <button id="10" class="cell">O</button>
            <button id="11" class="cell">X</button>
            <button id="12" class="cell">X</button>
            <button id="20" class="cell">O</button>
            <button id="21" class="cell">O</button>
            <button id="22" class="cell">X</button>
        </div>
        <div><button id="restartGame" class="restart">Restart</button></div>
    </main>
    <footer class="footer">
        <h3>The Philosopher's Playground</h3>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
