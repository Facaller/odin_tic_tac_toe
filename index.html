<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div id="grid" class="grid-container">
            <div id="00" class="cell">X</div>
            <div id="01" class="cell">X</div>
            <div id="02" class="cell">O</div>
            <div id="10" class="cell">O</div>
            <div id="11" class="cell">X</div>
            <div id="12" class="cell">X</div>
            <div id="20" class="cell">O</div>
            <div id="21" class="cell">O</div>
            <div id="22" class="cell">X</div>
        </div>
    </main>
    <footer>
        <h3>Footer Information</h3>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
